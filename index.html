<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d14" />
    <title>Агрегатор автозапчастей — Поиск деталей, цен и магазинов</title>
    <meta name="description" content="Поиск автозапчастей по артикулу, бренду, названию или марке автомобиля. Сравнивайте предложения магазинов-партнёров вашего города." />
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Apply saved theme before React mounts to avoid flash
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('agg_theme') || 'dark');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
