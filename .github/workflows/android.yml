name: Build Android APK

# Собирает debug-APK PARTSEEKER в облаке.
# Запускается на каждый push в main/master и вручную (workflow_dispatch).
# Готовый app-debug.apk доступен во вкладке Actions → Artifacts.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Diagnostics
        run: |
          node -v
          npm -v
          npx cap --version || true

      - name: Install dependencies
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Sync Capacitor (Android)
        run: |
          set +e
          out=$(npx cap sync android 2>&1)
          code=$?
          echo "$out"
          {
            echo '### cap sync output (exit '"$code"')';
            echo '```';
            echo "$out";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ]; then
            echo "::error::cap sync failed (exit $code): $(echo "$out" | tail -8 | tr '\n' ' | ')"
          fi
          exit $code

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: |
          set +e
          chmod +x ./gradlew
          out=$(./gradlew assembleDebug --no-daemon --stacktrace 2>&1)
          code=$?
          echo "$out"
          {
            echo '### gradle output (exit '"$code"')';
            echo '```';
            echo "$out" | tail -120;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ]; then
            echo "::error::gradle build failed (exit $code): $(echo "$out" | grep -iE 'error|exception|failed' | tail -6 | tr '\n' ' | ')"
          fi
          exit $code

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: partseeker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
